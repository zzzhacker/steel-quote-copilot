[project]
name = "steelquote"
version = "0.1.0"
description = "RFQ-to-quote copilot for a steel service center (Odoo 19, LangGraph, MCP, Langfuse)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "pint>=0.24",
  "faker>=28",
  "langchain>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-community>=0.3",
  "langchain-postgres>=0.0.12",
  "psycopg[binary]>=3.2",
  "fastembed>=0.4",
  "rank-bm25>=0.2.2",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2",
  "langchain-mcp-adapters>=0.1",
  "mcp>=1.2",
  "langfuse>=3",
  "langchain-google-genai>=4.4.2",
  "langchain-openai>=1.7.3",
  "fastapi>=0.162.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steelquote"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]
