<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steel RFQ Copilot</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true"></div>
    <div>
      <h1>Steel RFQ Copilot</h1>
      <p>Messy email in, grounded draft quote out</p>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" class="tab on" data-tab="copilot" aria-selected="true">Copilot</button>
    <button role="tab" class="tab" data-tab="evals" aria-selected="false">Evals</button>
    <button role="tab" class="tab" data-tab="how" aria-selected="false">How it works</button>
  </nav>
  <div class="stack" id="stack"></div>
</header>

<main>
  <section id="tab-copilot" class="grid">
    <aside class="col-left">
      <div class="card">
        <div class="card-head"><h2>1. Choose a request</h2></div>
        <label class="field-label" for="sample">Sample RFQ</label>
        <select id="sample"></select>
        <p class="about" id="about"></p>
        <label class="field-label" for="email">Email (edit it, or paste your own)</label>
        <textarea id="email" rows="11" spellcheck="false"></textarea>
        <div class="row">
          <button class="btn primary" id="run">Run quote</button>
          <button class="btn" id="reset">Clear</button>
        </div>
      </div>

      <div class="card" id="refine">
        <div class="card-head"><h2>2. Refine with chat</h2></div>
        <div class="thread" id="thread" aria-live="polite">
          <p class="muted" id="thread-empty">Run a request first, then change lines in plain English.</p>
        </div>
        <div class="chips" id="chips"></div>
        <form class="chat-form" id="chat-form">
          <input id="chat-input" type="text" autocomplete="off" placeholder="e.g. make line 1 3/8" disabled>
          <button class="btn primary" id="chat-send" disabled>Send</button>
        </form>
      </div>
    </aside>

    <section class="col-right">
      <div class="card">
        <div class="card-head"><h2>Pipeline</h2><span class="muted" id="pipe-total"></span></div>
        <ol class="pipeline" id="pipeline"></ol>
      </div>
      <div id="alert" class="alert" hidden></div>
      <div id="quote"></div>
    </section>
  </section>

  <section id="tab-evals" hidden></section>
  <section id="tab-how" hidden></section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
