services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db:/var/lib/postgresql/data
      - ./infra/init-er.sql:/docker-entrypoint-initdb.d/init-er.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
  odoo:
    image: odoo:19.0
    depends_on: [db]
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    command: ["--db-filter=^steel$$", "--proxy-mode"]
    volumes:
      - odoo-data:/var/lib/odoo
volumes:
  odoo-db:
  odoo-data:
